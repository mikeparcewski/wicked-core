# napi → npm release pipeline for `crates/wicked-core-ts` (DES-RELEASE-001 §2.3C).
#
# Bespoke (NOT the wicked-ci reusable Node release) because this ships a NATIVE napi addon: it needs
# a per-target cross-build matrix + the @napi-rs/cli platform-package assembly, which the pure-JS
# reusable workflow does not model. Fires ONLY on a `core-ts-v*` tag (a separate tag namespace from
# wicked-estate's `v*`, sharing this monorepo), so a maintainer pushing `core-ts-v0.1.0` starts it.
#
# Toolchain note: the binding is built against napi-rs runtime v2 (`napi`/`napi-derive` 2.16, feature
# `napi8`), so the COMPATIBLE CLI is `@napi-rs/cli` v2 (its `TYPE_DEF_TMP_PATH` type-def protocol
# matches napi-derive 2.16; the v3 CLI's `NAPI_TYPE_DEF_TMP_FOLDER` protocol does not, and emits an
# empty index.d.ts). Hence v2 command spellings below: `create-npm-dir` (singular), `artifacts`.
#
# Third-party actions are pinned to a commit SHA (matches wicked-ci/.github/workflows/node-release.yml).

name: napi release (wicked-core-ts)

on:
  push:
    tags:
      - 'core-ts-v*'
  # Dry run: build every matrix leg WITHOUT publishing. This workflow was previously
  # tag-only, so the only way to learn whether a cross-compile change worked was to cut a
  # tag and watch it fail — which is exactly what happened twice for the aarch64-linux
  # leg, each time publishing nothing while four legs went green. A build you cannot
  # rehearse is a build you debug in production.
  # Manual runs take no inputs; what they do depends entirely on the REF they run against:
  #   - a branch  -> builds every matrix leg, publishes nothing (the rehearsal)
  #   - a `core-ts-v*` tag -> builds and publishes, same as a tag push
  # Publishing is gated on the ref alone because the tag is where the version comes from, so
  # a branch has nothing to publish AS. There is deliberately no override input: it could only
  # ever publish an unversioned build (Copilot on #302).
  workflow_dispatch:

# Least privilege at the workflow level: `contents: read` only. `id-token: write` — the OIDC
# credential that powers npm provenance and trusted publishing — is granted on the PUBLISH job
# alone (Copilot on #302). It used to sit here, which was tolerable while a tag was the only
# trigger; adding `workflow_dispatch` means any branch rehearsal would otherwise mint a
# publishing token for the BUILD job, which never needs one.
permissions:
  contents: read

concurrency:
  group: napi-release-${{ github.ref }}
  cancel-in-progress: false

# wicked-core resolves wicked-estate from crates.io (published semver deps — see Cargo.toml), so the
# build needs NO sibling estate checkout and pins NO estate ref: the .node bundles the same published
# estate CI and local builds compile against. wicked-core is still checked out UNDER ./wicked-core so
# the napi build's working-directory (crates/wicked-core-ts, where .cargo/config.toml lives) and the
# artifact upload path below stay put — there is just no sibling next to it anymore.

jobs:
  # ── build the native addon once per target triple, upload the per-target *.node ────────────────
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: aarch64 is native on the (arm64) macos-latest runner; x86_64 cross-links against
          # the universal Apple SDK that clang already ships — no extra toolchain needed.
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          # Linux x64: native on ubuntu-latest.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          # Linux arm64: cross-compiled with the GNU cross-toolchain, NOT zig.
          #
          # rustc emits `--fix-cortex-a53-843419` for this target — a GNU binutils erratum flag.
          # zig links with lld, which does not implement it and rejects unknown args outright
          # (`error: unsupported linker arg: --fix-cortex-a53-843419`). That is not a version
          # problem: 0.13 and 0.14.1 both fail identically, so no zig bump fixes it. 0.6.3 and
          # 0.7.0 published because the rustc of the day did not pass the flag.
          #
          # `aarch64-linux-gnu-gcc` accepts it natively, being the toolchain the flag belongs to.
          # Note `cargo-zigbuild` — installed here previously — filters unsupported args and would
          # have absorbed this, but `napi build --zig` shells out to plain `cargo build` with a
          # generated linker script, so it never ran.
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: gnu
          # Windows x64: native MSVC on windows-latest.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    defaults:
      run:
        working-directory: wicked-core/crates/wicked-core-ts
    steps:
      - name: Checkout wicked-core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wicked-core

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'

      - name: Install Rust toolchain + target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"

      # GNU cross-toolchain for the aarch64-linux leg. Also provides the cross C compiler the
      # native deps need (ring, libsqlite3-sys, zstd-sys, onig_sys, esaxx-rs all build C).
      - name: Install the aarch64 GNU cross-toolchain
        if: matrix.cross == 'gnu'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # binutils-aarch64-linux-gnu is named EXPLICITLY even though gcc-aarch64-linux-gnu
          # pulls it in transitively (Copilot on #302): the build exports
          # AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar, so `ar` is a tool this workflow
          # depends on BY NAME. Relying on someone else's dependency graph for it means a
          # future gcc packaging change breaks the release leg with a missing-binary error.
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # --omit=optional: the platform packages in optionalDependencies aren't published yet (and we're
      # building them here, not consuming them). We only need the @napi-rs/cli devDependency.
      - name: Install build tooling (@napi-rs/cli)
        shell: bash
        run: npm install --omit=optional

      - name: napi build (${{ matrix.target }})
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross || '' }}" = "gnu" ]; then
            # Rust links through the cross gcc; cc-rs picks up CC_/CXX_ for the C deps.
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
            npx napi build --platform --release --target "${{ matrix.target }}"
          else
            npx napi build --platform --release --target "${{ matrix.target }}"
          fi
          ls -la ./*.node

      # ── The standalone `wicked-core` hook binary rides INSIDE each platform package (core#405,
      # F-009, F-SMOKE-006 — FIX-IT-ALL L10-9). Two lockfiles, one tree: the addon (this crate's
      # Cargo.lock) and the binary (the ROOT Cargo.lock) must embed the same wicked-estate, or the
      # engine and its hook disagree on the store — assert every `wicked-estate*` version agrees
      # before building either into a package.
      - name: Assert the root and core-ts lockfiles agree on wicked-estate*
        shell: bash
        working-directory: wicked-core
        run: |
          set -euo pipefail
          pins() { awk '/^name = "wicked-estate/ { n=$3 } /^version = / && n != "" { print n, $3; n="" }' "$1" | sort -u; }
          root="$(pins Cargo.lock)"; ts="$(pins crates/wicked-core-ts/Cargo.lock)"
          echo "root:"; echo "$root"; echo "core-ts:"; echo "$ts"
          [ -n "$root" ] || { echo "::error::no wicked-estate* pins found in the root Cargo.lock"; exit 1; }
          if [ "$root" != "$ts" ]; then
            echo "::error::the root Cargo.lock and crates/wicked-core-ts/Cargo.lock pin different wicked-estate* versions — the hook binary and the addon would embed two estates. Align them (cargo update -p wicked-estate… in the lagging tree) before tagging."
            exit 1
          fi

      # Stripped + thin-LTO release build of the ROOT crate's `wicked-core` bin for the same target
      # triple (the root crate declares no [profile.release] strip/lto — only core-ts does — so both
      # are passed on the command line; unstripped it measured 19.2 MB against a 14.3 MB platform
      # package). The gnu cross leg exports the same linker/cc env as the napi build above. The file
      # is named PER TARGET so the merged artifact download in `publish` cannot collide.
      - name: Build the wicked-core hook binary (${{ matrix.target }}, stripped, thin LTO)
        shell: bash
        working-directory: wicked-core
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross || '' }}" = "gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
            export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          fi
          cargo build --release --locked --bin wicked-core --target "${{ matrix.target }}" \
            --config profile.release.strip=true --config 'profile.release.lto="thin"'
          ext=""; case "${{ matrix.target }}" in *windows*) ext=".exe";; esac
          src="target/${{ matrix.target }}/release/wicked-core${ext}"
          dst="crates/wicked-core-ts/wicked-core-${{ matrix.target }}${ext}"
          cp "$src" "$dst"
          ls -la "$dst"
          echo "wicked-core hook binary (${{ matrix.target }}): $(wc -c < "$dst") bytes — the size delta register L10-e records"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-${{ matrix.target }}
          # path is workspace-root-relative (upload-artifact ignores defaults.run.working-directory);
          # wicked-core is checked out under ./wicked-core (see the checkout-path note above).
          path: |
            wicked-core/crates/wicked-core-ts/*.node
            wicked-core/crates/wicked-core-ts/wicked-core-*
          if-no-files-found: error
          retention-days: 7

  # ── assemble the platform packages from the artifacts and publish all 6 packages to npm ─────────
  publish:
    name: publish to npm
    needs: build
    # The ONLY job that needs the OIDC publishing credential.
    permissions:
      contents: read
      id-token: write
    # Publish ONLY from a `core-ts-v*` tag ref — the tag is where the version comes from, so
    # a branch has nothing to publish as. There is deliberately no override input: an escape
    # hatch here publishes an unversioned build, and the rehearsal this trigger exists for
    # needs no such power (Copilot on #302).
    if: startsWith(github.ref, 'refs/tags/core-ts-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/wicked-core-ts
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Provenance + OIDC trusted publishing need a recent npm (>= 11.5); Node 20 ships npm 10.
      - name: Upgrade npm (provenance-capable)
        shell: bash
        run: npm install -g npm@^11

      - name: Install build tooling (@napi-rs/cli)
        shell: bash
        run: npm install --omit=optional

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#core-ts-v}"
          echo "Releasing wicked-core-ts@$VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Keep the main package's optionalDependencies in lockstep with the platform packages.
          for abi in darwin-x64 darwin-arm64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc; do
            npm pkg set "optionalDependencies.wicked-core-ts-$abi=$VERSION"
          done

      - name: Create per-platform npm dirs
        shell: bash
        run: npx napi create-npm-dir -t .

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: crates/wicked-core-ts/artifacts
          merge-multiple: true

      - name: Move *.node into the platform packages
        shell: bash
        run: npx napi artifacts --dir artifacts --dist npm

      # The hook binary rides beside the .node in its platform package, executable, listed in
      # `files[]`, and STAMPED: `wickedCoreVersion` = the ROOT crate's semver — the value the addon's
      # gate compares against the binary's `--version` (`our_semver = env!("CARGO_PKG_VERSION")` in
      # execute_wrapped.rs, the root crate, NOT this package's version) — so crew can assert
      # `<pkg>/wicked-core --version == package.json.wickedCoreVersion == /diagnostics.engineBinaries`
      # from one tree at the tag (core#405; the smoke's S09 check).
      - name: Place the wicked-core hook binary in each platform package and stamp wickedCoreVersion
        shell: bash
        run: |
          set -euo pipefail
          root_semver="$(cargo metadata --no-deps --format-version 1 --manifest-path ../../Cargo.toml | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const m=JSON.parse(d);const p=m.packages.find(p=>p.name==="wicked-core");if(!p){process.exit(1)}process.stdout.write(p.version)})')"
          echo "root crate wicked-core semver: $root_semver"
          declare -A ABI=(
            [aarch64-apple-darwin]=darwin-arm64
            [x86_64-apple-darwin]=darwin-x64
            [x86_64-unknown-linux-gnu]=linux-x64-gnu
            [aarch64-unknown-linux-gnu]=linux-arm64-gnu
            [x86_64-pc-windows-msvc]=win32-x64-msvc
          )
          placed=0
          for target in "${!ABI[@]}"; do
            abi="${ABI[$target]}"
            ext=""; case "$target" in *windows*) ext=".exe";; esac
            src="artifacts/wicked-core-${target}${ext}"
            dir="npm/${abi}"
            [ -f "$src" ] || { echo "::error::missing hook binary for ${target} (${src})"; exit 1; }
            [ -d "$dir" ] || { echo "::error::no platform package dir ${dir} for ${target}"; exit 1; }
            mv "$src" "${dir}/wicked-core${ext}"
            chmod +x "${dir}/wicked-core${ext}"
            (cd "$dir" && npm pkg set "files[]=wicked-core${ext}" "wickedCoreVersion=${root_semver}")
            echo "  ${dir}/wicked-core${ext}: $(wc -c < "${dir}/wicked-core${ext}") bytes, wickedCoreVersion=${root_semver}"
            placed=$(( placed + 1 ))
          done
          [ "$placed" -eq 5 ] || { echo "::error::placed ${placed} hook binaries, expected 5"; exit 1; }

      - name: Sync platform package versions
        shell: bash
        run: npx napi version

      # npm --provenance (below) rejects a publish whose package.json repository.url doesn't match the
      # OIDC provenance source repo (E422). napi's generated platform packages don't carry repository,
      # so set it explicitly on the main package AND every platform package before publishing.
      - name: Ensure repository field on all packages (npm provenance requirement)
        shell: bash
        run: |
          set -euo pipefail
          REPO_URL="git+https://github.com/mikeparcewski/wicked-core.git"
          npm pkg set repository.type=git "repository.url=$REPO_URL"
          for dir in npm/*/; do
            (cd "$dir" && npm pkg set repository.type=git "repository.url=$REPO_URL")
          done

      - name: Show assembled packages
        shell: bash
        run: |
          find npm -maxdepth 2 -name package.json -o -name '*.node' | sort

      # Publish the 5 platform packages first, then the main package (whose optionalDependencies
      # reference them). --provenance emits a build-provenance attestation via OIDC (id-token: write);
      # publishing is via npm trusted publishing (tokenless OIDC), matching the wicked-ci pattern.
      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail
          for dir in npm/*/; do
            echo "==> npm publish $dir"
            npm publish "$dir" --access public --provenance
          done

      - name: Publish main package
        shell: bash
        run: npm publish --access public --provenance

  # ── re-stamp main's lockfile against the packages that now exist on npm (#422) ───────────────────
  #
  # The release PR structurally CANNOT carry resolvable platform entries: the five
  # `wicked-core-ts-<platform>` packages do not exist on npm until this workflow publishes them, so
  # `npm install --package-lock-only` at PR time writes them as version-less `{ "optional": true }`
  # stubs. `npm ci` (ci.yml's `core-ts TypeScript contract assertions` step) accepts those stubs
  # only while the version is unpublished; the moment the six packages land, the ideal tree
  # resolves `<ver>` and every later `npm ci` on main fails with `lock file's
  # wicked-core-ts-<platform>@ does not satisfy wicked-core-ts-<platform>@<ver>`. main went red
  # after 0.7.17 (#414 absorbed the re-stamp) and 0.7.18 (run 34524209387 red on the leg that ran
  # after the publish; #423 re-stamped; run 34527823078 green).
  #
  # ci.yml is deliberately left on `npm ci`: that failure IS the lock-sync guarantee doing its job
  # on a lockfile that is genuinely out of sync, so this job removes the cause instead of teaching
  # CI to tolerate it. It waits for the registry to serve the main package and every platform
  # package (npm processes a publish asynchronously — "a few minutes"; ~8 min observed on crew
  # #514), regenerates the lockfile on `main`, and opens a lockfile-only PR. It never pushes to main.
  lockfile:
    name: re-stamp main's lockfile (opens a PR)
    needs: publish
    if: startsWith(github.ref, 'refs/tags/core-ts-v')
    runs-on: ubuntu-latest
    # `contents: write` pushes the `chore/core-ts-<ver>-lockfile` branch; `pull-requests: write`
    # opens the PR — both with the workflow's own GITHUB_TOKEN, since nothing else in this repo
    # opens PRs and no PAT/App token exists. Two GitHub limits follow, both stated on the PR:
    #   - the repo setting "Allow GitHub Actions to create and approve pull requests" must be on,
    #     or `gh pr create` is refused (the branch is still pushed — the step says so and links
    #     the compare page);
    #   - a PR opened by GITHUB_TOKEN does not trigger `pull_request` workflows, so CI runs on it
    #     only after a close/reopen or a push to the branch.
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: crates/wicked-core-ts
    steps:
      # `main`, not the tag's commit: main may have moved since the release PR merged, and the
      # re-stamp must apply to what CI is red on.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Same npm major as the publish job: the lockfile is regenerated by the toolchain that
      # published the packages, not by whatever the runner image ships.
      - name: Upgrade npm (match the publish job)
        shell: bash
        run: npm install -g npm@^11

      - name: Released version vs main's manifest
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#core-ts-v}"
          MANIFEST="$(node -p "require('./package.json').version")"
          echo "  released : ${VERSION}"
          echo "  main     : ${MANIFEST}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "::warning::main's crates/wicked-core-ts/package.json is at ${MANIFEST}, not the released ${VERSION}, so main's lockfile describes ${MANIFEST} and there is nothing to re-stamp for this tag. Skipping the re-stamp."
            echo "restamp=false" >> "$GITHUB_OUTPUT"
          else
            echo "restamp=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait until the registry serves every package (up to 15 min)
        if: steps.version.outputs.restamp == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # `--prefer-online`: the registry serves packuments with `cache-control: max-age=300`, so
          # without it a 30 s poll can keep re-reading the stale, pre-publish packument from npm's
          # local cache for five minutes after the registry has caught up.
          # `timeout 60` on every lookup: npm's own fetch timeout is 5 min with retries, so an
          # unbounded `npm view` could outlive the deadline below (Copilot on #427).
          #
          # The platform packages are whatever package.json's optionalDependencies declare — the
          # same entries the publish job stamps — so a new target cannot be left un-awaited here
          # (Copilot on #427).
          packages="wicked-core-ts $(node -p "Object.keys(require('./package.json').optionalDependencies).join(' ')")"
          count="$(echo "$packages" | wc -w | tr -d ' ')"
          echo "  awaiting ${count} packages:${packages}"
          started="$(date +%s)"
          deadline=$(( started + 15 * 60 ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            missing=""
            for pkg in $packages; do
              if served="$(timeout 60 npm view --prefer-online "${pkg}@${VERSION}" version 2>/dev/null)" \
                 && [ "$served" = "$VERSION" ]; then
                continue
              fi
              missing="${missing} ${pkg}"
            done
            if [ -z "$missing" ]; then
              echo "  ok — all ${count} packages resolve at ${VERSION} after $(( $(date +%s) - started ))s (attempt ${attempt})"
              break
            fi
            now="$(date +%s)"
            if [ "$now" -ge "$deadline" ]; then
              echo "::error::the registry still does not serve${missing} at ${VERSION} after 15 minutes. The publish job succeeded, so this is npm's asynchronous processing, not a publish failure — re-run ONLY this job (Re-run failed jobs), never the publish job (a second publish fails with EPUBLISHCONFLICT)."
              exit 1
            fi
            echo "  not yet:${missing} — attempt ${attempt}, $(( now - started ))s elapsed of 15 min; next check in 30s"
            sleep 30
          done

      - name: Regenerate the lockfile against the published packages
        id: lockfile
        if: steps.version.outputs.restamp == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The wait above can last 15 minutes; re-base on the current main and re-check the manifest
          # so the re-stamp cannot pair a newer package.json with this release's entries (Copilot on
          # #427).
          git fetch -q origin main
          git reset -q --hard origin/main
          MANIFEST="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "::warning::main moved to ${MANIFEST} while waiting for the registry; its lockfile now describes ${MANIFEST}, not the released ${VERSION}, so there is nothing to re-stamp for this tag. Skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-online
          # Lockfile-only by construction — refuse to open a PR that carries anything else. Counted
          # rather than compared against a path, so the check does not depend on how `git status`
          # spells the path from this working directory (Copilot on #427).
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "  package-lock.json already describes the published ${VERSION}; nothing to open"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n' "$changed" | wc -l)" -eq 1 ] && ! git diff --quiet -- package-lock.json; then
            git --no-pager diff --stat -- package-lock.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm install --package-lock-only touched more than package-lock.json — refusing to open a PR for this tree:"
            echo "$changed"
            exit 1
          fi

      - name: Open the lockfile PR
        if: steps.lockfile.outputs.changed == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="chore/core-ts-${VERSION}-lockfile"
          # Idempotent across re-runs (Copilot on #427): stop only when a PR for the branch already
          # exists (open, merged or closed — never nag). A branch WITHOUT a PR means an earlier run
          # pushed it and `gh pr create` then failed (the repo-setting case, or a transient API
          # error); the branch is this job's own, so replace it with this run's re-stamp and retry.
          existing="$(gh pr list --head "$BRANCH" --state all --json number,state,url --jq '.[] | "  PR #\(.number) \(.state) \(.url)"')"
          if [ -n "$existing" ]; then
            echo "::notice::a PR for ${BRANCH} already exists — leaving it alone."
            echo "$existing"
            exit 0
          fi
          git config user.name "github-actions[bot]"

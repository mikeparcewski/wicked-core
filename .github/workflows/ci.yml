# PR + main build/test gate for wicked-core.
#
# wicked-core resolves wicked-estate from crates.io (published semver deps — see Cargo.toml), so CI
# needs NO sibling estate checkout and pins NO estate ref: the registry release CI compiles is the
# same one local and the napi release resolve. (`lockstep.rs` guards that no workflow reintroduces a
# raw estate ref.)
#
# Until this workflow existed, wicked-core had NO build/test on PRs — merges rode on locally-run tests
# only. This is the gate: fmt + clippy(-D warnings) + build + test, all on the estate rustls graph.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Offline embedder — the memory engine must not download a model in CI (matches the tests' own default).
  WICKED_MEMORY_EMBEDDER: hash
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · build · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: wicked-core
    steps:
      - name: Checkout wicked-core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wicked-core

      - name: Install Rust toolchain (+ rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wicked-core

      # fmt first — cheapest gate, fails fast on style drift.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace

      # Linux: arm bubblewrap so the `#[cfg(unix)]` sandbox tests exercise the REAL bwrap jail
      # (core#415). Until now the ubuntu leg had no `bwrap`, every bwrap-gated test printed its skip,
      # and the Linux floor shipped through a green gate — the `--tmpfs` on a missing secret dir that
      # killed every floor and pinned validator on Linux (core#460/#493) was never CI-visible. Same
      # recipe as wicked-ci's smoke harness; the `/bin/true` probe proves the runner can arm at all.
      - name: Arm the checks sandbox (bubblewrap) on Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bubblewrap passt
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent -- /bin/true
          echo "bwrap can arm a boundary on this runner"
          # core#1295: the demo recorder's one-port jail is bwrap inside a `pasta` namespace. The
          # port-jail tests fail here, rather than skip, when either is missing.
          pasta --quiet -t none -u none -U none -- bwrap --ro-bind / / --dev /dev --proc /proc \
            --unshare-user --cap-drop ALL --die-with-parent -- /bin/true
          echo "WICKED_REQUIRE_PASTA=1" >> "$GITHUB_ENV"

      # DES-BUILD-GUIDE: the build-guide probe fixtures run against a REAL pytest and vitest here
      # (elsewhere they skip): a lane-local venv on PATH, and `WICKED_TEST_VITEST` naming vitest.
      - name: pytest and vitest for the build-guide probe fixtures (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/probe-py"
          "$RUNNER_TEMP/probe-py/bin/pip" install --quiet pytest
          echo "$RUNNER_TEMP/probe-py/bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/probe-vt" --no-audit --no-fund vitest@3
          echo "WICKED_TEST_VITEST=$RUNNER_TEMP/probe-vt/node_modules/.bin/vitest" >> "$GITHUB_ENV"
          # A probe fixture that would skip here (no tool, no sandbox) fails instead.
          echo "WICKED_REQUIRE_PROBE_TOOLS=1" >> "$GITHUB_ENV"

      # core#1762: the real-browser draft-render jail test
      # (`actor::draft_render_live::a_real_browser_prints_in_the_read_allowlisted_jail_without_a_venv`)
      # needs a headless shell; without one it skipped, and CI reported it as passed. This provisions
      # Playwright's `chrome-headless-shell` at the version crew provisions its renderer with (cached
      # on that version, so a hit costs one restore and no npx), and sets
      # `WICKED_REQUIRE_HEADLESS_SHELL` so the test fails here rather than skip.
      - name: Restore the headless shell (draft-render jail test)
        if: runner.os != 'Windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ms-playwright
          key: chrome-headless-shell-${{ runner.os }}-${{ runner.arch }}-playwright-1.64.0

      - name: Provision the headless shell (draft-render jail test)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLAYWRIGHT_VERSION: 1.64.0
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
        run: |
          set -euo pipefail
          find_shell() {
            find "$PLAYWRIGHT_BROWSERS_PATH" -type f \
              -path '*/chrome-headless-shell-*/chrome-headless-shell' 2>/dev/null | head -n 1
          }
          shell="$(find_shell || true)"
          if [ -z "$shell" ]; then
            npx --yes "playwright@$PLAYWRIGHT_VERSION" install --only-shell chromium
            shell="$(find_shell || true)"
          fi
          test -n "$shell" && test -x "$shell"
          # The runner usually has every library the shell links; only when it cannot start are the
          # system packages installed (three tries: the runner's apt mirrors fail at times).
          if ! "$shell" --version; then
            test "$RUNNER_OS" = Linux
            for i in 1 2 3; do
              npx --yes "playwright@$PLAYWRIGHT_VERSION" install-deps chromium && break
              test "$i" != 3
              sleep 30
            done
            "$shell" --version
          fi
          echo "WICKED_TEST_HEADLESS_SHELL=$shell" >> "$GITHUB_ENV"
          echo "WICKED_REQUIRE_HEADLESS_SHELL=1" >> "$GITHUB_ENV"

      - name: Release script tests (scripts/changelog-section.py core#1552, scripts/npm-publish-resumable.py core#1556)
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: cargo test
        run: cargo test --workspace

      # wicked-core-ts is EXCLUDED from the workspace (its `[profile.release]` lto+strip shapes the
      # shipped .node artifact, and cargo ignores member profiles). Every gate above therefore skips
      # it, so it gets its own — it is the crate the daemon actually loads, and until now CI never
      # compiled it at all.
      - name: cargo fmt/clippy/test wicked-core-ts (excluded from the workspace)
        run: |
          cargo fmt --manifest-path crates/wicked-core-ts/Cargo.toml --check
          cargo clippy --manifest-path crates/wicked-core-ts/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/wicked-core-ts/Cargo.toml

      # `scripts/finalize-dts.mjs` is the ONLY producer of `index.d.ts`'s hand-authored block, and
      # `npm run build` / `build:debug` end by running it — yet until now no gate here EXECUTED it:
      # the lockstep cargo test above reads the script as TEXT (`include_str!`, unescaping \` before
      # it compares, so an escaped and an unescaped backtick read the same), and the tsc step below
      # `npm ci --ignore-scripts` over the committed `index.d.ts`. #444 shipped four unescaped
      # backticks inside the template literal — a SyntaxError that turned build-from-source red in
      # every consumer (wicked-crew CI's "Build wicked-core-ts from source") while every gate here
      # stayed green. So: parse the script, then run it against the committed `index.d.ts`
      # (idempotent by contract: strip the old block, re-append) and require a byte-identical file.
      # `shell: bash` so every line gates on every runner (pwsh does not stop on a native command's
      # exit code mid-script); `.gitattributes` pins `*.d.ts` to LF, so the Windows diff is clean.
      - name: core-ts finalize-dts.mjs parses and reproduces the committed index.d.ts
        working-directory: wicked-core/crates/wicked-core-ts
        shell: bash
        run: |
          node --check scripts/finalize-dts.mjs
          node scripts/finalize-dts.mjs
          git diff --exit-code -- index.d.ts

      # The binding's hand-authored TypeScript contract (`CoreEventJson`, `UnitDistributedEventJson`
      # — `scripts/finalize-dts.mjs`, shipped in `index.d.ts`) is asserted at COMPILE time over the
      # committed `index.d.ts` (`types-test/`, core#401): a loosened or drifted declaration fails
      # here, not in a consumer's build. Node is preinstalled on every hosted runner; the cargo test
      # above already pins the `.d.ts` ↔ script lockstep, this checks what TypeScript sees.
      - name: core-ts TypeScript contract assertions (tsc --noEmit)
        working-directory: wicked-core/crates/wicked-core-ts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      # Backend-parity compile check (DES-OUTGOV-001 §5): estate's Postgres backend, wired through
      # the engine's `dyn GraphStore` seam + `AnyStore`, must keep COMPILING under `--features
      # postgres` (it pulls sqlx + tokio). No Postgres SERVICE is needed for the compile — the
      # `postgres-parity` job below provisions a real Postgres and runs the full round-trip.
      # The default gate above already asserts the OTHER half of §5: a `postgres://` spec is REJECTED
      # (fail-closed) when the feature is OFF (`postgres_spec_fails_closed_without_feature` test).
      - name: cargo build --features postgres (backend compile-parity)
        run: cargo build --features postgres

  postgres-parity:
    name: postgres backend round-trip
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: wicked-core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wicked
          POSTGRES_PASSWORD: wicked
          POSTGRES_DB: estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wicked -d estate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout wicked-core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wicked-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wicked-core
          key: postgres-parity

      - name: cargo test wicked-apps-core --features postgres (Postgres round-trip, core#30)
        env:
          TEST_POSTGRES_URL: postgres://wicked:wicked@localhost:5432/estate_test
        run: cargo test --manifest-path crates/wicked-apps-core/Cargo.toml --features postgres

  # core#1476: the checks floor image and a seat image built on it carry the pinned Rust toolchain on
  # the default PATH, so a repository whose rust-toolchain.toml names `channel = "stable"` builds
  # with the image's own binaries (rustup would otherwise try to install `stable` into a read-only
  # RUSTUP_HOME). No other job builds images; the image tests are stubs or WICKED_CONTAINER_LIVE-gated.
  # core#1455 / core#1614: both architectures the seats run on (Rancher Desktop on Apple silicon is
  # arm64), since the browser and media layer comes from each architecture's own Debian archive.
  seat-toolchain:
    name: floor + seat image toolchain (ubuntu ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout wicked-core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build the checks floor image and the claude seat image on it
        run: |
          set -eu
          docker build -t wicked-checks-floor:ci - < containers/checks/node22-rust.Dockerfile
          pkg="$(grep -o '@anthropic-ai/claude-code@[0-9.]*' src/container_floor.rs | head -n1)"
          test -n "$pkg"
          # Match the engine's self-contained default build: OCI solvers cannot use a local tag.
          {
            sed 's/^FROM ${BASE}$/FROM ${BASE} AS wicked_toolchain/' containers/checks/node22-rust.Dockerfile
            sed -e '/^# syntax=/d' -e '/^ARG BASE=/d' -e 's/^FROM ${BASE}$/FROM wicked_toolchain/' containers/seats/seat.Dockerfile
          } > "$RUNNER_TEMP/seat.Dockerfile"
          docker build --build-arg CLI=claude \
            --build-arg "CLI_PACKAGE=$pkg" --build-arg "CLI_PIN=$pkg" \
            -t wicked-seat-claude:ci - < "$RUNNER_TEMP/seat.Dockerfile"

      # The ledger layer is best effort in the Dockerfile (a failed install still builds), so assert
      # here that it succeeded on the new base: QE records its verdict with it (core#1009).
      - name: The ledger install layer succeeded on the new base
        run: |
          set -eu
          docker run --rm --network none --entrypoint sh wicked-seat-claude:ci -euc \
            'test -f /opt/wicked-ledger/node_modules/wicked-ledger/package.json && grep "\"version\"" /opt/wicked-ledger/node_modules/wicked-ledger/package.json'

      # core#1210: the fence's push helper, run in the image as a seat runs (read-only root, /tmp a
      # tmpfs, no network), admits a fixture push to a bare repository in /tmp and refuses the rest.
      # core#1785: the fence's one empty-prefix rewrite hands it every push URL as spelled, a
      # relative path (resolved in git's own working directory) and an insteadOf name included.
      - name: The seat push helper admits a /tmp fixture push and refuses the rest
        run: |
          set -eu
          docker run --rm --network none --read-only --user 1000:1000 --tmpfs /tmp:exec \
            --entrypoint /usr/bin/env wicked-seat-claude:ci -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=url.wicked-nopush::.pushInsteadOf GIT_CONFIG_VALUE_0= \
            GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.invalid \
            GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.invalid \
            sh -euc '
              git init -q -b main /tmp/work
              git -C /tmp/work commit -q --allow-empty -m fixture
              git init -q --bare /tmp/fixture.git
              git -C /tmp/work push -q /tmp/fixture.git HEAD:refs/heads/main
              git --git-dir=/tmp/fixture.git rev-parse -q --verify refs/heads/main
              git -C /tmp/work push -q ../fixture.git HEAD:refs/heads/rel
              git --git-dir=/tmp/fixture.git rev-parse -q --verify refs/heads/rel
              git -C /tmp/work config url./tmp/.insteadOf zz:
              for target in /tmp/../usr /tmp ../../usr . zz:usr https://example.invalid/r.git \
                  example.invalid:o/r.git; do
                if git -C /tmp/work push "$target" HEAD:refs/heads/x 2>/tmp/err; then
                  echo "a push to $target was admitted" >&2; exit 1
                fi
                grep -q wicked-nopush /tmp/err || { cat /tmp/err >&2; exit 1; }
              done
            '

      - name: A crate with rust-toolchain.toml channel = "stable" builds in both images
        run: |
          set -eu
          dir="$(mktemp -d)"
          mkdir -p "$dir/tiny/src"
          printf '[toolchain]\nchannel = "stable"\n' > "$dir/tiny/rust-toolchain.toml"
          printf '[package]\nname = "tiny"\nversion = "0.1.0"\nedition = "2021"\n' > "$dir/tiny/Cargo.toml"
          printf 'fn main() {\n    println!("{}", add(1, 2));\n}\n\npub fn add(a: u32, b: u32) -> u32 {\n    a + b\n}\n\n#[cfg(test)]\nmod tests {\n    #[test]\n    fn adds() {\n        assert_eq!(super::add(1, 2), 3);\n    }\n}\n' > "$dir/tiny/src/main.rs"
          chmod -R a+rwX "$dir"
          for image in wicked-checks-floor:ci wicked-seat-claude:ci; do
            echo "== $image"
            # The Debian PATH and no RUSTUP_* variables; the image's rustup home is read-only to
            # this user, as in a seat. The network is off: the crate has no dependencies.
            docker run --rm --network none --read-only --user 1000:1000 --tmpfs /tmp:exec \
              -v "$dir/tiny:/work/tiny" -w /work/tiny --entrypoint /usr/bin/env "$image" \
              -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin HOME=/tmp \
              CARGO_HOME=/tmp/cargo-home CARGO_TARGET_DIR=/tmp/target \
              sh -euc 'cargo run && cargo clippy -- -D warnings && cargo fmt --check && cargo test'
          done

      # core#1455, core#1614: the seat's own browser and media tools, run as a seat runs them:
      # under the floor's own landrun with the seat's production grants
      # (tests/fixtures/seat-floor/landrun-work-ro.args, asserted equal to landrun_prefix), the
      # operator's uid, a read-only root, HOME and /tmp tmpfs, no network, no new privileges and no
      # capabilities. Screens at both sizes in both themes, then stills sampled at named times from
      # a video, as the demo review's contact sheet does (ffprobe, ffmpeg -ss).
      - name: Build the floor image (the seat's trusted launcher and landrun)
        run: docker build -t wicked-floor:ci - < containers/floor.Dockerfile

      - name: The seat takes screenshots and samples video stills offline, under the floor
        run: |
          set -eu
          dir="$(mktemp -d)"
          mkdir -p "$dir/floor" "$dir/work"
          cid="$(docker create wicked-floor:ci /busybox true)"
          docker cp "$cid:/landrun" "$dir/floor/landrun"
          docker rm "$cid" >/dev/null
          cat > "$dir/work/page.html" <<'EOF'
          <!doctype html><style>html,body{margin:0;height:100%;background:#fff}
          @media (prefers-color-scheme: dark){html,body{background:#000}}</style><p>wicked seat</p>
          EOF
          cat > "$dir/work/shoot.sh" <<'EOF'
          set -eu
          # The policy holds: a writable mount the grants do not name is refused.
          if (echo x > /probe/x) 2>/dev/null; then
            echo "Landlock is not enforced here; this check would prove nothing" >&2; exit 1
          fi
          out=/tmp/shots; mkdir -p "$out"
          command -v chromium ffmpeg ffprobe
          # The colour of the pixel at (x, y) of an image: "r g b".
          pixel() {
            ffmpeg -v error -i "$1" -vf "crop=1:1:$2:$3" -f rawvideo -pix_fmt rgb24 - \
              | od -An -tu1 | tr -s ' ' | sed 's/^ //;s/ $//'
          }
          for size in 1440,700 390,844; do
            w="${size%,*}"; h="${size#*,}"
            for theme in light dark; do
              f="$out/$theme-$w.png"
              flag=; [ "$theme" = dark ] && flag=--force-dark-mode
              timeout 60 chromium $flag --window-size="$size" --hide-scrollbars --screenshot="$f" \
                file:///work/page.html 2>/tmp/chromium.err || { cat /tmp/chromium.err >&2; exit 1; }
              dims="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$f")"
              px="$(pixel "$f" $((w - 1)) $((h - 1)))"
              echo "$theme $size: $dims, corner pixel $px"
              [ "$dims" = "$size" ] || { echo "the $theme shot is $dims, not $size" >&2; exit 1; }
              want="255 255 255"; [ "$theme" = dark ] && want="0 0 0"
              [ "$px" = "$want" ] || { echo "the $theme shot's background is $px, not $want" >&2; exit 1; }
            done
          done
          # Red for the first 2 s, blue for the next 2 s: a still at 0.5 s is red and at 2.5 s blue.
          ffmpeg -v error -f lavfi -i color=c=red:s=320x240:r=10:d=2 -f lavfi -i color=c=blue:s=320x240:r=10:d=2 \
            -filter_complex '[0:v][1:v]concat=n=2:v=1:a=0' -c:v mpeg4 -q:v 2 /tmp/demo.mp4
          dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/demo.mp4)"
          echo "video: ${dur}s"
          case "$dur" in 4|4.0*|3.9*) ;; *) echo "the video is ${dur}s, not 4s" >&2; exit 1 ;; esac
          for at in 0.5 2.5; do
            f="$out/still-$at.png"
            ffmpeg -v error -ss "$at" -i /tmp/demo.mp4 -frames:v 1 "$f"
            test -s "$f" || { echo "no still at ${at}s" >&2; exit 1; }
            dims="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$f")"
            px="$(pixel "$f" 160 120)"
            echo "still at ${at}s: $dims, centre pixel $px"
            [ "$dims" = 320,240 ] || { echo "the still at ${at}s is $dims, not 320,240" >&2; exit 1; }
            set -- $px
            if [ "$at" = 0.5 ]; then [ "$1" -gt 200 ] && [ "$3" -lt 60 ]; else [ "$3" -gt 200 ] && [ "$1" -lt 60 ]; fi \
              || { echo "the still at ${at}s is not from its time ($px)" >&2; exit 1; }
          done
          EOF
          chmod -R a+rX "$dir"
          mapfile -t policy < tests/fixtures/seat-floor/landrun-work-ro.args
          docker run --rm --network none --read-only --user 1000:1000 \
            --security-opt no-new-privileges --cap-drop ALL \
            --tmpfs /tmp:exec --tmpfs /home/seat --tmpfs /probe:mode=1777 \
            -v "$dir/floor:/floor:ro" -v "$dir/work:/work:ro" --entrypoint /usr/bin/env \
            wicked-seat-claude:ci -i PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/home/seat TMPDIR=/tmp LANG=C.UTF-8 "${policy[@]}" -- sh /work/shoot.sh

      - name: Record the seat image size and the browser and media layer's share
        run: |
          set -eu
          total="$(docker image inspect -f '{{.Size}}' wicked-seat-claude:ci)"
          layer="$(docker history --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' wicked-seat-claude:ci \
            | grep -m1 'chromium fonts-liberation ffmpeg' | cut -f1)"
          test -n "$layer"
          line="seat image (claude, ${{ matrix.arch }}): $(( total / 1000000 )) MB in total; the browser and media layer (chromium, fonts-liberation, ffmpeg) adds $layer"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

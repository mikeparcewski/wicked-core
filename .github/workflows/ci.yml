# PR + main build/test gate for wicked-core.
#
# wicked-core resolves wicked-estate from crates.io (published semver deps — see Cargo.toml), so CI
# needs NO sibling estate checkout and pins NO estate ref: the registry release CI compiles is the
# same one local and the napi release resolve. (`lockstep.rs` guards that no workflow reintroduces a
# raw estate ref.)
#
# Until this workflow existed, wicked-core had NO build/test on PRs — merges rode on locally-run tests
# only. This is the gate: fmt + clippy(-D warnings) + build + test, all on the estate rustls graph.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Offline embedder — the memory engine must not download a model in CI (matches the tests' own default).
  WICKED_MEMORY_EMBEDDER: hash
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · build · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: wicked-core
    steps:
      - name: Checkout wicked-core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wicked-core

      - name: Install Rust toolchain (+ rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wicked-core

      # fmt first — cheapest gate, fails fast on style drift.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace

      # wicked-core-ts is EXCLUDED from the workspace (its `[profile.release]` lto+strip shapes the
      # shipped .node artifact, and cargo ignores member profiles). Every gate above therefore skips
      # it, so it gets its own — it is the crate the daemon actually loads, and until now CI never
      # compiled it at all.
      - name: cargo fmt/clippy/test wicked-core-ts (excluded from the workspace)
        run: |
          cargo fmt --manifest-path crates/wicked-core-ts/Cargo.toml --check
          cargo clippy --manifest-path crates/wicked-core-ts/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/wicked-core-ts/Cargo.toml

      # `scripts/finalize-dts.mjs` is the ONLY producer of `index.d.ts`'s hand-authored block, and
      # `npm run build` / `build:debug` end by running it — yet until now no gate here EXECUTED it:
      # the lockstep cargo test above reads the script as TEXT (`include_str!`, unescaping \` before
      # it compares, so an escaped and an unescaped backtick read the same), and the tsc step below
      # `npm ci --ignore-scripts` over the committed `index.d.ts`. #444 shipped four unescaped
      # backticks inside the template literal — a SyntaxError that turned build-from-source red in
      # every consumer (wicked-crew CI's "Build wicked-core-ts from source") while every gate here
      # stayed green. So: parse the script, then run it against the committed `index.d.ts`
      # (idempotent by contract: strip the old block, re-append) and require a byte-identical file.
      # `shell: bash` so every line gates on every runner (pwsh does not stop on a native command's
      # exit code mid-script); `.gitattributes` pins `*.d.ts` to LF, so the Windows diff is clean.
      - name: core-ts finalize-dts.mjs parses and reproduces the committed index.d.ts
        working-directory: wicked-core/crates/wicked-core-ts
        shell: bash
        run: |
          node --check scripts/finalize-dts.mjs
          node scripts/finalize-dts.mjs
          git diff --exit-code -- index.d.ts

      # The binding's hand-authored TypeScript contract (`CoreEventJson`, `UnitDistributedEventJson`
      # — `scripts/finalize-dts.mjs`, shipped in `index.d.ts`) is asserted at COMPILE time over the
      # committed `index.d.ts` (`types-test/`, core#401): a loosened or drifted declaration fails
      # here, not in a consumer's build. Node is preinstalled on every hosted runner; the cargo test
      # above already pins the `.d.ts` ↔ script lockstep, this checks what TypeScript sees.
      - name: core-ts TypeScript contract assertions (tsc --noEmit)
        working-directory: wicked-core/crates/wicked-core-ts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      # Backend-parity compile check (DES-OUTGOV-001 §5): estate's Postgres backend, wired through
      # the engine's `dyn GraphStore` seam + `AnyStore`, must keep COMPILING under `--features
      # postgres` (it pulls sqlx + tokio). No Postgres SERVICE is needed for the compile — the
      # `postgres-parity` job below provisions a real Postgres and runs the full round-trip.
      # The default gate above already asserts the OTHER half of §5: a `postgres://` spec is REJECTED
      # (fail-closed) when the feature is OFF (`postgres_spec_fails_closed_without_feature` test).
      - name: cargo build --features postgres (backend compile-parity)
        run: cargo build --features postgres

  postgres-parity:
    name: postgres backend round-trip
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: wicked-core
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wicked
          POSTGRES_PASSWORD: wicked
          POSTGRES_DB: estate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wicked -d estate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout wicked-core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wicked-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wicked-core
          key: postgres-parity

      - name: cargo test wicked-apps-core --features postgres (Postgres round-trip, core#30)
        env:
          TEST_POSTGRES_URL: postgres://wicked:wicked@localhost:5432/estate_test
        run: cargo test --manifest-path crates/wicked-apps-core/Cargo.toml --features postgres

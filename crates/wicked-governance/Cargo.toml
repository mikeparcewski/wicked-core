[package]
name = "wicked-governance"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Vendored into wicked-core (was crates.io 0.3.0, yanked). Deterministic policy/decision engine over the wicked-estate graph."
publish = false

[dependencies]
wicked-apps-core = { path = "../wicked-apps-core" }
wicked-estate-core = "0.14.3"
wicked-estate-store = "0.14.3"
# The fan-out's knowledge lane (AW-5 / arch-R3): rationale chunks written + smoke-verified through
# the SAME engine the estate MCP's knowledge.recall serves. Same 0.14.x line as the store deps.
wicked-estate-knowledge = "0.14.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
sha2 = "0.10"
